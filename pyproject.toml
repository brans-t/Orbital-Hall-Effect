[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ohk"
version = "0.1.0"
description = "Orbital Hall kit: gauge-invariant OAM matrix elements and orbital Hall conductivity from Wannier/tight-binding models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Orbital-Hall-effect project" }]
keywords = ["orbital Hall effect", "OAM", "Wannier", "tight-binding", "Kubo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Optional model backends
pythtb = ["pythtb>=1.8"]
# Plotting / reporting
plot = ["matplotlib>=3.7"]
# Large-model caching and Wannier90 file parsing helpers
io = ["h5py>=3.8"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1"]

[project.scripts]
ohc-run = "ohk.cli:main"
oam-scan = "ohk.cli:main_scan"
ohk-validate = "ohk.cli:main_validate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: larger finite-lattice reference calculation"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
